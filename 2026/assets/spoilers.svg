<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <!-- Legend -->
  <rect x="280" y="8" width="20" height="20" rx="3" fill="#f2b84b"/>
  <text x="310" y="25" font-size="22" fill="#b8c9c0">before</text>
  <rect x="410" y="8" width="20" height="20" rx="3" fill="#7fd1a8"/>
  <text x="440" y="25" font-size="22" fill="#b8c9c0">after</text>
  <text x="1120" y="25" font-size="18" fill="#b8c9c0" text-anchor="end" font-style="italic">bars scaled per row</text>

  <!-- Flink apps -->
  <text x="0" y="25" font-size="26" font-weight="700" fill="#f2f5f3">Flink apps</text>
  <text x="0" y="53" font-size="20" fill="#b8c9c0">Single tenant</text>
  <text x="0" y="91" font-size="24"><tspan font-weight="800" fill="#ff6bcb">30K</tspan><tspan fill="#b8c9c0" font-size="20"> hosts</tspan></text>
  <text x="0" y="121" font-size="24"><tspan font-weight="800" fill="#4fc3f7">1.5M</tspan><tspan fill="#b8c9c0" font-size="20"> cores</tspan></text>
  <text x="0" y="151" font-size="24"><tspan font-weight="800" fill="#ff9f43">11 PB</tspan><tspan fill="#b8c9c0" font-size="20"> RAM</tspan></text>

  <!-- Stateless apps -->
  <text x="0" y="253" font-size="26" font-weight="700" fill="#f2f5f3">Stateless apps</text>
  <text x="0" y="281" font-size="20" fill="#b8c9c0">Multi tenant</text>

  <!-- P99: 14.6 min -> 4.5 min -->
  <text x="266" y="92" font-size="20" font-weight="700" fill="#b8c9c0" text-anchor="end">P99</text>
  <rect x="280" y="50" width="620" height="32" rx="4" fill="#f2b84b"/>
  <text x="912" y="75" font-size="24" fill="#f2f5f3">14.6 min</text>
  <rect x="280" y="88" width="191" height="32" rx="4" fill="#7fd1a8"/>
  <text x="483" y="113" font-size="24" font-weight="700" fill="#7fd1a8">4.5 min</text>

  <!-- P99: 7.3 min -> 2 min -->
  <text x="266" y="267" font-size="20" font-weight="700" fill="#b8c9c0" text-anchor="end">P99</text>
  <rect x="280" y="225" width="620" height="32" rx="4" fill="#f2b84b"/>
  <text x="912" y="250" font-size="24" fill="#f2f5f3">7.3 min</text>
  <rect x="280" y="263" width="170" height="32" rx="4" fill="#7fd1a8"/>
  <text x="462" y="288" font-size="24" font-weight="700" fill="#7fd1a8">2 min</text>

  <!-- P50: 33 s -> 8 s -->
  <text x="266" y="352" font-size="20" font-weight="700" fill="#b8c9c0" text-anchor="end">P50</text>
  <rect x="280" y="310" width="620" height="32" rx="4" fill="#f2b84b"/>
  <text x="912" y="335" font-size="24" fill="#f2f5f3">33 s</text>
  <rect x="280" y="348" width="150" height="32" rx="4" fill="#7fd1a8"/>
  <text x="442" y="373" font-size="24" font-weight="700" fill="#7fd1a8">8 s</text>
</svg>
